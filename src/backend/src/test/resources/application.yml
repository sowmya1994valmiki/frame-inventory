spring:
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  test:
    database:
      replace: none
  datasource:
    url: jdbc:h2:mem:frame-inventory;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
